<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#090d15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agenda Team</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   AGENDA TEAM — stile
   ========================================================= */
:root{
  --bg:#090d15; --bg2:#0f1522; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.08);
  --txt:#eef2f8; --mut:#8b96ab; --app:#38bdf8; --ins:#fb923c; --solo:#a78bfa; --ok:#34d399; --ko:#f87171;
  --r:20px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{overflow-x:hidden;padding-bottom:calc(110px + var(--safe-b))}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,rgba(56,189,248,.18),transparent 70%),
             radial-gradient(35% 30% at 90% 25%,rgba(251,146,60,.16),transparent 70%),
             radial-gradient(45% 35% at 50% 100%,rgba(167,139,250,.12),transparent 70%);
  animation:float 18s ease-in-out infinite alternate}
@keyframes float{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + var(--safe-t)) 18px 0}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:var(--r)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello small{color:var(--mut);font-size:13px}
.hello h1{font-family:Montserrat;font-weight:800;font-size:26px;letter-spacing:-.5px;margin-top:2px}
.hello h1 span{background:linear-gradient(90deg,var(--app),var(--ins));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}

/* stato */
.status{margin-top:18px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{padding:12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.who .n{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.who .s{font-weight:700;margin-top:6px;font-size:15px}
.who .d{font-size:12px;color:var(--mut);margin-top:2px;min-height:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
.dot.busy{background:var(--ko);box-shadow:0 0 0 0 rgba(248,113,113,.6)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}

/* settimana */
.week-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.week-head b{font-family:Montserrat;font-size:16px;text-transform:capitalize}
.week-head .nav{display:flex;gap:6px}
.week-head .nav button{width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{padding:10px 0 8px;border-radius:16px;text-align:center;border:1px solid transparent;transition:.25s}
.day small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
.day b{display:block;font-size:17px;margin-top:4px}
.day .marks{display:flex;justify-content:center;gap:3px;height:6px;margin-top:6px}
.day .marks i{width:5px;height:5px;border-radius:50%}
.day.today b{color:var(--app)}
.day.sel{background:linear-gradient(160deg,rgba(56,189,248,.25),rgba(251,146,60,.18));border-color:rgba(255,255,255,.15);transform:translateY(-2px)}

/* filtri */
.seg{display:flex;gap:6px;margin:18px 0 6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);white-space:nowrap;color:var(--mut)}
.seg button.on{color:#0b0f17;background:var(--txt)}

/* lista */
.list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:8px}
.ev{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:14px;position:relative;overflow:hidden;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ev .h{font-weight:700;font-size:15px}
.ev .h small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.ev .t{font-weight:600;font-size:15px;line-height:1.25}
.ev .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tag.g{--c:var(--mut)}
.ev .acts{display:flex;gap:6px}
.ev .acts button,.ev .acts a{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt)}
.ev .acts svg{width:18px;height:18px}
.ev.done{opacity:.5}.ev.done .t{text-decoration:line-through}
.ev.now{box-shadow:0 0 0 1px var(--c),0 10px 30px -10px var(--c)}
.chk.on{background:var(--ok)!important;color:#08110d!important;border-color:var(--ok)!important}

/* fab */
.fab{position:fixed;right:20px;bottom:calc(24px + var(--safe-b));width:64px;height:64px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--app),var(--ins));color:#0b0f17;box-shadow:0 16px 40px -10px rgba(251,146,60,.6);z-index:20;transition:.2s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(3,6,12,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:30}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;z-index:31;
  background:linear-gradient(180deg,#141b2b,#0d1320);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.2,1)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:4px auto 14px}
.sheet h2{font-family:Montserrat;font-size:20px;margin-bottom:14px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.f input,.f textarea,.f select{width:100%;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);outline:none;font-size:16px}
.f input:focus,.f textarea:focus{border-color:var(--app)}
.f textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f input{min-width:0}
input[type=date],input[type=time]{color-scheme:dark}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:90px;padding:12px 10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:center;transition:.2s}
.chip.on{border-color:var(--c,var(--app));background:color-mix(in srgb,var(--c,var(--app)) 20%,transparent);color:var(--txt)}
.switch{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.switch input{appearance:none;width:48px;height:28px;border-radius:99px;background:#2a3346;position:relative;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--ok)}.switch input:checked::after{left:23px}
.btn{width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--app),var(--ins));color:#0b0f17}
.btn.sec{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line)}
.btn.del{background:rgba(248,113,113,.12);color:var(--ko);border:1px solid rgba(248,113,113,.3)}
.btns{display:grid;gap:10px;margin-top:6px}
.hint{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.45}
.conflict{display:none;padding:12px;border-radius:14px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#fecaca;font-size:13px;margin-bottom:14px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:440px;margin:0 auto}
.logo{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--app),var(--ins));margin-bottom:22px;box-shadow:0 20px 50px -15px rgba(56,189,248,.6)}
.logo svg{width:38px;height:38px;color:#0b0f17}
.login h1{font-family:Montserrat;font-size:30px;font-weight:800;letter-spacing:-.6px}
.login p{color:var(--mut);margin:8px 0 26px;line-height:1.5}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(251,146,60,.15);color:var(--ins);margin-top:12px}

/* toast */
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-150%);z-index:50;padding:13px 18px;border-radius:16px;
  background:#1b2436;border:1px solid var(--line);font-size:14px;font-weight:600;transition:.35s cubic-bezier(.2,.9,.2,1);max-width:92vw;box-shadow:0 20px 40px -12px #000}
.toast.on{transform:translate(-50%,0)}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="vLogin" class="login hidden">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/></svg></div>
  <h1>Agenda Team</h1>
  <p>L'agenda condivisa del tuo team: appuntamenti, chiamate di lavoro e notifiche in tempo reale.</p>
  <div id="loginFirebase">
    <div class="f"><label>Nome utente</label><input id="lEmail" type="text" autocomplete="username" autocapitalize="off" placeholder="Es. emiliano"></div>
    <div class="f"><label>Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="lBtn">Entra</button>
  </div>
  <div id="loginDemo" class="hidden">
    <div class="f"><label>Chi sei?</label></div>
    <div class="btns">
      <button class="btn" data-demo="davide" id="dA">Sono Davide</button>
      <button class="btn sec" data-demo="collega" id="dB">Sono Emiliano</button>
    </div>
    <span class="badge">MODALITÀ PROVA · dati solo su questo dispositivo</span>
  </div>
</section>

<!-- ================= APP ================= -->
<main id="vApp" class="hidden">
  <div class="wrap">
    <header class="top">
      <div class="hello"><small id="hDate"></small><h1>Ciao <span id="hName"></span></h1></div>
      <button class="icon-btn glass" id="bSet" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <button class="glass hidden" id="notifBanner" style="width:100%;margin-top:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;border-color:rgba(251,146,60,.45);background:rgba(251,146,60,.1)">
      <span style="font-size:26px">🔔</span>
      <span><b style="display:block">Attiva le notifiche</b><small style="color:var(--mut)">Tocca qui per ricevere gli avvisi anche ad app chiusa</small></span>
    </button>

    <button class="glass hidden" id="installBanner" style="width:100%;margin-top:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.1)">
      <span style="font-size:26px">📲</span>
      <span><b style="display:block">Installa l'app sul telefono</b><small style="color:var(--mut)">Tocca qui: avrai l'icona Agenda Team nella schermata Home</small></span>
    </button>

    <section class="status glass" id="status"></section>

    <div class="week-head">
      <b id="wTitle"></b>
      <div class="nav">
        <button id="wPrev" aria-label="Settimana precedente">‹</button>
        <button id="wToday" style="width:auto;padding:0 12px;font-size:13px;font-weight:600">Oggi</button>
        <button id="wNext" aria-label="Settimana successiva">›</button>
      </div>
    </div>
    <div class="week" id="week"></div>

    <div class="seg" id="seg">
      <button data-f="tutto" class="on">Tutto</button>
      <button data-f="appuntamento">📅 Appuntamenti</button>
      <button data-f="insieme">🤝 Chiamate insieme</button>
      <button data-f="mie">📞 Da fare da me</button>
      <button data-f="sue">📞 Del collega</button>
    </div>

    <div class="list" id="list"></div>
  </div>

  <button class="fab" id="fab" aria-label="Nuovo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</main>

<!-- ================= SHEET EVENTO ================= -->
<div class="veil" id="veil"></div>
<div class="sheet" id="sEv">
  <div class="grab"></div>
  <h2 id="sEvTitle">Nuovo</h2>

  <div class="f"><label>Tipo</label>
    <div class="chips" id="cTipo">
      <button class="chip on" data-v="appuntamento" style="--c:var(--app)">📅 Appuntamento</button>
      <button class="chip" data-v="chiamata" style="--c:var(--ins)">📞 Chiamata</button>
    </div>
  </div>

  <div class="f" id="fChi"><label id="lChi">Chi la fa</label>
    <div class="chips" id="cChi"></div>
  </div>

  <div class="f"><label id="lTit">Descrizione</label><input id="iTit" placeholder="Es. Manutenzione caldaia sig. Rossi"></div>

  <div class="f"><label>Data</label><input id="iData" type="date"></div>
  <div class="row">
    <div class="f"><label>Dalle</label><input id="iIni" type="time"></div>
    <div class="f"><label>Alle</label><input id="iFin" type="time"></div>
  </div>

  <div class="conflict" id="conf"></div>

  <div class="f" id="fTel"><label>Telefono da chiamare</label><input id="iTel" type="tel" inputmode="tel" placeholder="Es. 333 1234567"></div>
  <div class="f"><label>Note</label><textarea id="iNote" placeholder="Indirizzo, dettagli, cosa dire..."></textarea></div>

  <div class="f switch"><span>🔔 Avvisa il collega</span><input type="checkbox" id="iNotif" checked></div>

  <div class="btns">
    <button class="btn" id="bSave">Salva</button>
    <button class="btn del hidden" id="bDel">Elimina</button>
  </div>
</div>

<!-- ================= SHEET IMPOSTAZIONI ================= -->
<div class="sheet" id="sSet">
  <div class="grab"></div>
  <h2>Impostazioni</h2>
  <div class="row">
    <div class="f"><label>Nome tuo</label><input id="sNomeA"></div>
    <div class="f"><label>Nome collega</label><input id="sNomeB"></div>
  </div>
  <div class="f switch"><span id="notifStato">🔔 Notifiche su questo telefono</span><button class="chip" id="bAttiva" style="flex:0;min-width:auto;padding:10px 14px">Attiva</button></div>
  <div class="f"><label>Promemoria prima dell'inizio</label>
    <select id="sPrima">
      <option value="0">All'orario esatto</option>
      <option value="10">10 minuti prima</option>
      <option value="15">15 minuti prima</option>
      <option value="30">30 minuti prima</option>
      <option value="60">1 ora prima</option>
    </select>
  </div>
  <div class="btns">
    <button class="btn" id="bSetSave">Salva impostazioni</button>
    <button class="btn sec" id="bTest">🔔 Invia notifica di prova al collega</button>
    <button class="btn sec" id="bTestMe">📲 Invia notifica di prova a me</button>
    <button class="btn sec" id="bInstall">⬇️ Installa l'app sul telefono</button>
    <button class="btn sec" id="bOut">Esci</button>
  </div>
  <p class="hint" id="modeInfo" style="text-align:center;margin-top:14px"></p>
</div>

<div class="toast" id="toast"></div>

  form: { tipo: 'appuntamento', chi: null },
  cfg: { nomi: { davide: 'Davide', collega: 'Emiliano' }, prima: 0 }
};
const other = () => state.me === 'davide' ? 'collega' : 'davide';
const nome = id => id === 'insieme' ? 'Insieme' : (state.cfg.nomi[id] || id);

/* ---------------- toast ---------------- */
let tT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2600); }

/* =========================================================
   ARCHIVIO DATI (Firebase oppure modalità prova)
   ========================================================= */
const Store = {
  db: null, unsub: null, onChange: () => {},

  async init() {
    if (MODE === 'firebase') {
      firebase.initializeApp(FIREBASE_CONFIG);
      this.db = firebase.firestore();
      try { await this.db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
    }
  },

  listen() {
    if (this.listening) return; this.listening = true;
    if (MODE === 'firebase') {
      this.db.collection('impostazioni').doc('generale').onSnapshot(s => {
        if (s.exists) { mergeCfg(s.data()); render(); }
        else this.saveCfg(state.cfg);
      });
      this.unsub = this.db.collection('eventi').onSnapshot(snap => {
        const prima = state.eventi.length > 0 || Date.now() - START > 4000;
        snap.docChanges().forEach(ch => {
          const ev = ch.doc.data();
          if (ch.type === 'added' && prima && ev.creatoDa === other() && (ev.createdAt || 0) > START) avvisoInApp(ev);
        });
        this.onChange(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      });
    } else {
      const load = () => {
        const c = JSON.parse(localStorage.getItem('at_cfg') || 'null');
        if (c) mergeCfg(c); else this.saveCfg(state.cfg);
        this.onChange(JSON.parse(localStorage.getItem('at_eventi') || '[]'));
      };
      window.addEventListener('storage', load);
      load();
    }
  },

  _local() { return JSON.parse(localStorage.getItem('at_eventi') || '[]'); },
  _saveLocal(a) { localStorage.setItem('at_eventi', JSON.stringify(a)); this.onChange(a); },

  async add(ev) {
    ev.createdAt = Date.now(); ev.creatoDa = state.me;
    if (MODE === 'firebase') { const r = await this.db.collection('eventi').add(ev); return r.id; }
    const a = this._local(); ev.id = rnd(); a.push(ev); this._saveLocal(a); return ev.id;
  },
  async update(id, patch) {
    patch.updatedAt = Date.now();
    if (MODE === 'firebase') return this.db.collection('eventi').doc(id).update(patch);
    const a = this._local().map(e => e.id === id ? { ...e, ...patch } : e); this._saveLocal(a);
  },
  async remove(id) {
    if (MODE === 'firebase') return this.db.collection('eventi').doc(id).delete();
    this._saveLocal(this._local().filter(e => e.id !== id));
  },
  async saveCfg(c) {
    if (MODE === 'firebase') return this.db.collection('impostazioni').doc('generale').set(c, { merge: true });
    localStorage.setItem('at_cfg', JSON.stringify(c));
  }
};

function mergeCfg(c) {
  state.cfg = {
    nomi: { ...state.cfg.nomi, ...(c.nomi || {}) },
    prima: c.prima ?? state.cfg.prima
  };
}

/* =========================================================
   NOTIFICHE PUSH (Firebase Cloud Messaging — arrivano ad app chiusa)
   ========================================================= */
let messaging = null, swReg = null;

// attiva le notifiche su questo telefono e salva il "codice dispositivo"
async function attivaNotifiche(silenzioso) {
  try {
    if (MODE !== 'firebase' || !('Notification' in window) || !('serviceWorker' in navigator)) {
      if (!silenzioso) toast('Questo browser non supporta le notifiche'); return false;
    }
    let perm = Notification.permission;
    if (perm === 'default' && !silenzioso) perm = await Notification.requestPermission();
    if (perm !== 'granted') { aggiornaBanner(); if (!silenzioso && perm === 'denied') toast('Notifiche bloccate: riattivale dalle impostazioni del browser'); return false; }
    swReg = swReg || await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    messaging = messaging || firebase.messaging();
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
    if (!token) return false;
    await Store.db.collection('dispositivi').doc(token).set({ utente: state.me, token, aggiornato: Date.now(), ua: navigator.userAgent.slice(0, 120) });
    localStorage.setItem('at_token', token);
    aggiornaBanner();
    if (!silenzioso) toast('🔔 Notifiche attivate su questo telefono');
    return true;
  } catch (e) { if (!silenzioso) toast('Errore attivazione notifiche: ' + e.message); return false; }
}

function aggiornaBanner() {
  const b = $('#notifBanner'); if (!b) return;
  const ok = MODE === 'firebase' && 'Notification' in window && Notification.permission === 'granted' && localStorage.getItem('at_token');
  b.classList.toggle('hidden', !!ok || MODE !== 'firebase');
}

// invia una notifica a 'davide', 'collega' o 'entrambi'
async function push(destinatario, titolo, messaggio) {
  if (MODE !== 'firebase' || !URL_NOTIFICHE) return false;
  try {
    const idToken = await firebase.auth().currentUser.getIdToken();
    const r = await fetch(URL_NOTIFICHE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
      body: JSON.stringify({ a: destinatario, titolo, testo: messaggio, link: location.origin + location.pathname })
    });
    return r.ok;
  } catch (e) { return false; }
}

function testoEvento(ev) {
  const d = toDate(ev.inizio), f = toDate(ev.fine);
  const giorno = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  return `${giorno} · ${hm(d)}–${hm(f)}\n${ev.titolo}${ev.telefono ? '\n📞 ' + ev.telefono : ''}${ev.note ? '\n📝 ' + ev.note : ''}`;
}

// avviso immediato all'altro (il promemoria all'ora di inizio lo manda il server)
async function notificaNuovo(ev, modificato) {
  const io = nome(state.me), dest = other();
  let titolo;
  if (ev.tipo === 'appuntamento') {
    titolo = ev.chi === state.me ? `⛔ ${io} ${modificato ? 'ha spostato un appuntamento' : 'non è disponibile'}`
                                 : `📅 ${io} ti ha segnato un appuntamento`;
  } else if (ev.chi === 'insieme') {
    titolo = `🤝 Chiamata da fare INSIEME${modificato ? ' (modificata)' : ''}`;
  } else if (ev.chi === dest) {
    titolo = `📞 ${io} ti ha assegnato una chiamata${modificato ? ' (modificata)' : ''}`;
  } else {
    titolo = `📞 ${io} ha in programma una chiamata`;
  }
  return push(dest, titolo, testoEvento(ev));
}

function avvisoInApp(ev) {
  const txt = `${nome(ev.creatoDa)}: ${ev.tipo === 'appuntamento' ? 'nuovo appuntamento' : 'nuova chiamata'} · ${ev.titolo}`;
  toast('🔔 ' + txt);
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Agenda Team', { body: txt, icon: 'icon.svg' }); } catch (e) {}
  }
}

/* =========================================================
   LOGICA
   ========================================================= */
function evDelGiorno(g) {
  return state.eventi.filter(e => e.inizio.slice(0, 10) === g).sort((a, b) => a.inizio.localeCompare(b.inizio));
}
function passaFiltro(e) {
  const f = state.filtro;
  if (f === 'tutto') return true;
  if (f === 'appuntamento') return e.tipo === 'appuntamento';
  if (f === 'insieme') return e.tipo === 'chiamata' && e.chi === 'insieme';
  if (f === 'mie') return e.tipo === 'chiamata' && e.chi === state.me;
  if (f === 'sue') return e.tipo === 'chiamata' && e.chi === other();
  return true;
}
function colore(e) {
  if (e.tipo === 'appuntamento') return 'var(--app)';
  return e.chi === 'insieme' ? 'var(--ins)' : 'var(--solo)';
}
// stato di una persona adesso: occupata se ha un appuntamento in corso
function statoPersona(id) {
  const ora = new Date(), oraS = `${ymd(ora)}T${hm(ora)}`;
  const suoi = state.eventi.filter(e => e.tipo === 'appuntamento' && e.chi === id);
  const inCorso = suoi.find(e => e.inizio <= oraS && e.fine > oraS);
  if (inCorso) return { busy: true, s: 'Occupato', d: `fino alle ${e2h(inCorso.fine)} · ${inCorso.titolo}` };
  const prox = suoi.filter(e => e.inizio > oraS && e.inizio.slice(0, 10) === ymd(ora)).sort((a, b) => a.inizio.localeCompare(b.inizio))[0];
  return { busy: false, s: 'Libero', d: prox ? `fino alle ${e2h(prox.inizio)}` : 'per il resto di oggi' };
}
const e2h = s => s.slice(11, 16);

function conflitti(ev, escludiId) {
  // se è un appuntamento: si sovrappone ad altri miei impegni?
  // se è una chiamata: la persona coinvolta è occupata in quell'orario?
  const persone = ev.chi === 'insieme' ? ['davide', 'collega'] : [ev.chi];
  return state.eventi.filter(e => e.id !== escludiId && e.tipo === 'appuntamento' && persone.includes(e.chi)
    && e.inizio < ev.fine && e.fine > ev.inizio);
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  if (!state.me) return;
  const oggi = new Date();
  $('#hName').textContent = nome(state.me);
  $('#hDate').textContent = oggi.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

  // stato
  $('#status').innerHTML = [state.me, other()].map(id => {
    const s = statoPersona(id);
    return `<div class="who"><div class="n"><span class="dot ${s.busy ? 'busy' : ''}"></span>${esc(nome(id))}${id === state.me ? ' (tu)' : ''}</div>
      <div class="s" style="color:${s.busy ? 'var(--ko)' : 'var(--ok)'}">${s.s}</div><div class="d">${esc(s.d)}</div></div>`;
  }).join('');

  // settimana
  const ws = state.weekStart;
  $('#wTitle').textContent = ws.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(ws.getDate() + i);
    const k = ymd(d), evs = evDelGiorno(k);
    const marks = [...new Set(evs.map(colore))].slice(0, 3).map(c => `<i style="background:${c}"></i>`).join('');
    h += `<button class="day ${k === ymd(oggi) ? 'today' : ''} ${k === state.sel ? 'sel' : ''}" data-d="${k}">
      <small>${GIORNI[d.getDay()]}</small><b>${d.getDate()}</b><div class="marks">${marks}</div></button>`;
  }
  $('#week').innerHTML = h;

  // lista
  const oraS = `${ymd(oggi)}T${hm(oggi)}`;
  const evs = evDelGiorno(state.sel).filter(passaFiltro);
  if (!evs.length) {
    $('#list').innerHTML = `<div class="empty glass"><div class="big">🗓️</div>Nessun impegno in questo giorno.<br>Tocca <b>+</b> per aggiungerne uno.</div>`;
    return;
  }
  $('#list').innerHTML = evs.map((e, i) => {
    const c = colore(e);
    const now = e.inizio <= oraS && e.fine > oraS;
    const tipoTag = e.tipo === 'appuntamento'
      ? `<span class="tag">📅 ${esc(nome(e.chi))} occupato</span>`
      : `<span class="tag">${e.chi === 'insieme' ? '🤝 Insieme' : '📞 Da solo: ' + esc(nome(e.chi))}</span>`;
    const da = e.creatoDa && e.creatoDa !== state.me ? `<span class="tag g">da ${esc(nome(e.creatoDa))}</span>` : '';
    const tel = e.telefono ? `<a href="tel:${esc(e.telefono.replace(/\s/g, ''))}" aria-label="Chiama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>` : '';
    const chk = e.tipo === 'chiamata' ? `<button class="chk ${e.fatto ? 'on' : ''}" data-chk="${e.id}" aria-label="Fatta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg></button>` : '';
    return `<div class="ev glass ${e.fatto ? 'done' : ''} ${now ? 'now' : ''}" style="--c:${c};animation-delay:${i * 40}ms" data-id="${e.id}">
      <div class="h">${e2h(e.inizio)}<small>${e2h(e.fine)}</small></div>
      <div><div class="t">${esc(e.titolo)}</div><div class="m">${tipoTag}${da}${now ? '<span class="tag" style="--c:var(--ko)">● in corso</span>' : ''}</div></div>
      <div class="acts">${tel}${chk}</div></div>`;
  }).join('');
}

/* =========================================================
   FORM EVENTO
   ========================================================= */
function openSheet(id) { $('#veil').classList.add('on'); $(id).classList.add('on'); }
function closeSheets() { $('#veil').classList.remove('on'); $$('.sheet').forEach(s => s.classList.remove('on')); }

function renderChi() {
  const t = state.form.tipo;
  $('#lChi').textContent = t === 'appuntamento' ? 'Di chi è l\'appuntamento' : 'Chi la fa';
  const opz = t === 'appuntamento'
    ? [[state.me, 'Mio', 'var(--app)'], [other(), nome(other()), 'var(--app)']]
    : [['insieme', '🤝 Insieme', 'var(--ins)'], [state.me, 'Da solo io', 'var(--solo)'], [other(), 'Solo ' + nome(other()), 'var(--solo)']];
  if (!opz.some(o => o[0] === state.form.chi)) state.form.chi = opz[0][0];
  $('#cChi').innerHTML = opz.map(([v, l, c]) => `<button class="chip ${v === state.form.chi ? 'on' : ''}" data-v="${v}" style="--c:${c}">${esc(l)}</button>`).join('');
  $$('#cTipo .chip').forEach(b => b.classList.toggle('on', b.dataset.v === t));
  $('#fTel').classList.toggle('hidden', t !== 'chiamata');
  $('#lTit').textContent = t === 'appuntamento' ? 'Descrizione' : 'Chi chiamare / motivo';
  $('#iTit').placeholder = t === 'appuntamento' ? 'Es. Manutenzione caldaia sig. Rossi' : 'Es. Fornitore ricambi – ordine valvole';
  checkConflitti();
}

function leggiForm() {
  return {
    tipo: state.form.tipo, chi: state.form.chi,
    titolo: $('#iTit').value.trim(),
    inizio: `${$('#iData').value}T${$('#iIni').value}`,
    fine: `${$('#iData').value}T${$('#iFin').value}`,
    telefono: state.form.tipo === 'chiamata' ? $('#iTel').value.trim() : '',
    note: $('#iNote').value.trim()
  };
}
function checkConflitti() {
  const box = $('#conf');
  if (!$('#iData').value || !$('#iIni').value || !$('#iFin').value) { box.style.display = 'none'; return; }
  const c = conflitti(leggiForm(), state.editId);
  if (!c.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = '⚠️ Attenzione, si sovrappone a: ' + c.map(e => `<b>${esc(nome(e.chi))}</b> ${e2h(e.inizio)}–${e2h(e.fine)} ${esc(e.titolo)}`).join(' · ');
}

function apriForm(ev) {
  state.editId = ev ? ev.id : null;
  $('#sEvTitle').textContent = ev ? 'Modifica' : 'Nuovo impegno';
  $('#bDel').classList.toggle('hidden', !ev);
  state.form.tipo = ev ? ev.tipo : 'appuntamento';
  state.form.chi = ev ? ev.chi : state.me;
  const now = new Date(); now.setMinutes(Math.ceil(now.getMinutes() / 15) * 15, 0, 0);
  const fine = new Date(now.getTime() + 60 * 60000);
  $('#iTit').value = ev ? ev.titolo : '';
  $('#iData').value = ev ? ev.inizio.slice(0, 10) : state.sel;
  $('#iIni').value = ev ? e2h(ev.inizio) : hm(now);
  $('#iFin').value = ev ? e2h(ev.fine) : hm(fine);
  $('#iTel').value = ev ? (ev.telefono || '') : '';
  $('#iNote').value = ev ? (ev.note || '') : '';
  $('#iNotif').checked = true;
  renderChi();
  openSheet('#sEv');
}

async function salva() {
  const ev = leggiForm();
  if (!ev.titolo) return toast('Scrivi una descrizione');
  if (!$('#iData').value || !$('#iIni').value || !$('#iFin').value) return toast('Inserisci data e orari');
  if (ev.fine <= ev.inizio) return toast('L\'orario di fine deve essere dopo l\'inizio');
  const btn = $('#bSave'); btn.disabled = true; btn.textContent = 'Salvo...';
  try {
    ev.avvisato = false;
    if (state.editId) await Store.update(state.editId, ev); else { ev.fatto = false; await Store.add(ev); }
    closeSheets();
    state.sel = ev.inizio.slice(0, 10); setWeek(toDate(ev.inizio)); render();
    if ($('#iNotif').checked) {
      const ok = await notificaNuovo(ev, !!state.editId);
      toast(ok ? `✅ Salvato e ${nome(other())} avvisato` : '✅ Salvato (notifica non inviata)');
    } else toast('✅ Salvato');
  } catch (e) { toast('Errore nel salvataggio: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Salva';
}

async function elimina() {
  const ev = state.eventi.find(e => e.id === state.editId);
  if (!ev || !confirm('Eliminare questo impegno?')) return;
  await Store.remove(ev.id);
  closeSheets(); render();
  if (toDate(ev.fine) > new Date())
    push(other(), `❌ ${nome(state.me)} ha annullato un impegno`, testoEvento(ev));
  toast('Eliminato');
}

/* =========================================================
   IMPOSTAZIONI
   ========================================================= */
function apriImpostazioni() {
  $('#sNomeA').value = state.cfg.nomi.davide;
  $('#sNomeB').value = state.cfg.nomi.collega;
  const attive = Notification?.permission === 'granted' && localStorage.getItem('at_token');
  $('#notifStato').textContent = attive ? '🔔 Notifiche attive su questo telefono' : '🔕 Notifiche non attive';
  $('#bAttiva').textContent = attive ? 'Riattiva' : 'Attiva';
  $('#sPrima').value = String(state.cfg.prima || 0);
  $('#modeInfo').textContent = MODE === 'firebase' ? '🟢 Collegata online · dati condivisi in tempo reale' : '🟠 Modalità prova · dati solo su questo dispositivo';
  openSheet('#sSet');
}
async function salvaImpostazioni() {
  state.cfg = {
    nomi: { davide: $('#sNomeA').value.trim() || 'Davide', collega: $('#sNomeB').value.trim() || 'Collega' },
    prima: Number($('#sPrima').value)
  };
  await Store.saveCfg(state.cfg);
  closeSheets(); render(); toast('Impostazioni salvate');
}

/* =========================================================
   SETTIMANA
   ========================================================= */
function setWeek(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const dow = (x.getDay() + 6) % 7;   // lunedì = 0
  x.setDate(x.getDate() - dow);
  state.weekStart = x;
}

/* =========================================================
   AVVIO
   ========================================================= */
function entra(id) {
  state.me = id;
  $('#vLogin').classList.add('hidden');
  $('#vApp').classList.remove('hidden');
  setWeek(new Date());
  Store.onChange = list => { state.eventi = list; render(); };
  Store.listen();
  // se le notifiche sono già permesse, rinnova il codice del dispositivo in silenzio
  if (MODE === 'firebase') attivaNotifiche(true);
  aggiornaBanner();
  render();
}

async function avvio() {
  await Store.init();

  if (MODE === 'firebase') {
    $('#loginDemo').classList.add('hidden');
    firebase.auth().onAuthStateChanged(u => {
      if (!u) { $('#vApp').classList.add('hidden'); $('#vLogin').classList.remove('hidden'); return; }
      const em = (u.email || '').toLowerCase();
      const id = Object.keys(UTENTI).find(k => (UTENTI[k] + DOMINIO).toLowerCase() === em);
      if (!id) { toast('Email non autorizzata'); firebase.auth().signOut(); return; }
      entra(id);
    });
    $('#lBtn').onclick = async () => {
      const u = $('#lEmail').value.trim().toLowerCase().replace(/\s/g, '');
      try { await firebase.auth().signInWithEmailAndPassword(u.includes('@') ? u : u + DOMINIO, $('#lPass').value); }
      catch (e) { toast('Nome o password errati'); }
    };
  } else {
    $('#loginFirebase').classList.add('hidden');
    $('#loginDemo').classList.remove('hidden');
    const p = localStorage.getItem('at_me');
    if (p) entra(p); else $('#vLogin').classList.remove('hidden');
    $$('[data-demo]').forEach(b => b.onclick = () => { localStorage.setItem('at_me', b.dataset.demo); entra(b.dataset.demo); });
  }

  // eventi interfaccia
  $('#fab').onclick = () => apriForm(null);
  $('#veil').onclick = closeSheets;
  $('#bSave').onclick = salva;
  $('#bDel').onclick = elimina;
  $('#bSet').onclick = apriImpostazioni;
  $('#bSetSave').onclick = salvaImpostazioni;
  $('#bTest').onclick = async () => {
    const ok = await push(other(), '🔔 Prova Agenda Team', `Ciao ${nome(other())}, le notifiche funzionano!`);
    toast(ok ? 'Notifica di prova inviata' : 'Invio non riuscito');
  };
  $('#bTestMe').onclick = async () => {
    const ok = await push(state.me, '📲 Prova Agenda Team', 'Se leggi questo messaggio, le notifiche su questo telefono funzionano!');
    toast(ok ? 'Notifica inviata: controlla il telefono' : 'Invio non riuscito');
  };
  $('#bAttiva').onclick = async () => { await attivaNotifiche(false); apriImpostazioni(); };
  $('#notifBanner').onclick = () => attivaNotifiche(false);
  $('#installBanner').onclick = installa;
  $('#bInstall').onclick = installa;
  aggiornaInstall();
  $('#bOut').onclick = () => {
    closeSheets();
    if (MODE === 'firebase') firebase.auth().signOut();
    else { localStorage.removeItem('at_me'); location.reload(); }
  };
  $('#cTipo').onclick = e => { const b = e.target.closest('.chip'); if (b) { state.form.tipo = b.dataset.v; state.form.chi = null; renderChi(); } };
  $('#cChi').onclick = e => { const b = e.target.closest('.chip'); if (b) { state.form.chi = b.dataset.v; renderChi(); } };
  ['#iData', '#iIni', '#iFin'].forEach(s => $(s).addEventListener('change', checkConflitti));
  $('#iIni').addEventListener('change', () => {   // fine automatica = inizio + 1h se non valida
    if ($('#iFin').value <= $('#iIni').value) { const d = toDate(`2000-01-01T${$('#iIni').value}`); d.setHours(d.getHours() + 1); $('#iFin').value = hm(d); checkConflitti(); }
  });
  $('#week').onclick = e => { const b = e.target.closest('.day'); if (b) { state.sel = b.dataset.d; render(); } };
  $('#wPrev').onclick = () => { state.weekStart.setDate(state.weekStart.getDate() - 7); render(); };
  $('#wNext').onclick = () => { state.weekStart.setDate(state.weekStart.getDate() + 7); render(); };
  $('#wToday').onclick = () => { state.sel = ymd(new Date()); setWeek(new Date()); render(); };
  $('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; state.filtro = b.dataset.f; $$('#seg button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  $('#list').onclick = async e => {
    if (e.target.closest('a')) return;
    const c = e.target.closest('[data-chk]');
    if (c) { const ev = state.eventi.find(x => x.id === c.dataset.chk); await Store.update(ev.id, { fatto: !ev.fatto }); return; }
    const card = e.target.closest('.ev');
    if (card) apriForm(state.eventi.find(x => x.id === card.dataset.id));
  };
  // swipe tra le settimane
  let sx = null;
  $('#week').addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
  $('#week').addEventListener('touchend', e => {
    if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) { state.weekStart.setDate(state.weekStart.getDate() + (dx < 0 ? 7 : -7)); render(); }
  });
  setInterval(render, 60000);   // aggiorna lo stato libero/occupato ogni minuto

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
avvio();
</script>
</body>
</html>
